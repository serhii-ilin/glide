[package]
name = "glide"
version = "0.1.0"
edition = "2024"
default-run = "glide"
license = "Apache-2.0"
description = "A small desktop web browser"
readme = "README.md"
rust-version = "1.91"
publish = false

[[bin]]
name = "glide"
path = "src/main.rs"

[[bin]]
name = "compat"
path = "src/bin/compat.rs"

[dependencies]
anyrender = "0.14"
anyrender_vello_cpu = { version = "0.18", features = ["softbuffer_window_renderer"] }
blitz-dom = { version = "=0.3.0-beta.4", default-features = false, features = [
    "svg",
    "woff",
    "system-fonts",
    "floats",
    "scrollbars",
] }
blitz-html = "=0.3.0-beta.4"
blitz-net = { version = "=0.3.0-beta.4", features = ["cookies"] }
blitz-paint = { version = "=0.3.0-beta.4", features = ["svg", "scrollbars"] }
blitz-shell = { version = "=0.3.0-beta.4", default-features = false, features = [
    "clipboard",
] }
blitz-traits = "=0.3.0-beta.4"
# ElementState::DEFINED for :defined (F-076 custom element upgrade); matches Blitz's stylo pin.
stylo_dom = "0.22.0"
peniko = "0.6"
png = "0.18"
reqwest = { version = "0.13.5", default-features = false, features = [
    "charset",
    "cookies",
    "http2",
    "native-tls",
    "system-proxy",
] }
# sync: Notify in src/net.rs for in-flight load coordination.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "net"] }
# F-077: page WebSocket client (one tokio task per socket, RFC 6455 via tungstenite).
tokio-tungstenite = "0.30.0"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
# Official MCP SDK: stdio server with tool macros for glide --mcp (F-066).
rmcp = { version = "3.11", default-features = false, features = [
    "server",
    "macros",
    "transport-io",
    "schemars",
] }
# JSON Schema for MCP tool input/output alongside rmcp.
schemars = "1.1"
url = "2"
winit = "=0.31.0-beta.3"
keyboard-types = "0.8"
v8 = "152.2.0"
crossbeam-channel = "0.5"
once_cell = "1"
html5ever = "0.40"
directories = "6.0.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# Decodes base64 `data:` URL payloads into `bodyBase64` fetch replies.
base64 = "0.23.1"
# Fills getRandomValues buffers with OS-backed entropy on the UI thread.
getrandom = "0.4"
# Shared cookie jar (F-058): same versions as reqwest 0.13.5's cookie stack in Cargo.lock.
cookie = "0.18.2"
cookie_store = { version = "0.22.1", default-features = false, features = [
    "serde_json",
    "public_suffix",
] }
# F-058: registrable-domain checks for Set-Cookie Domain= (via cookie_store's public_suffix feature).
publicsuffix = "2.3"

[patch.crates-io]
blitz-dom = { path = "third_party/blitz-dom" }
blitz-net = { path = "third_party/blitz-net" }

[dev-dependencies]
# Constructs Blitz pointer events in wheel/hover tests (same crate blitz-traits uses).
atomic_refcell = "0.1.14"

[profile.release]
lto = false
codegen-units = 8
