<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1E2A78"/>
      <stop offset="0.55" stop-color="#3B5BDB"/>
      <stop offset="1" stop-color="#4CC9F0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.72" cy="0.28" r="0.6">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="trail" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="wingTop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E6F0FF"/>
    </linearGradient>
    <linearGradient id="wingUnder" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#B9CCF5"/>
      <stop offset="1" stop-color="#8FA9E8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity="0.28"/>
    </filter>
    <filter id="planeShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0B1240" flood-opacity="0.35"/>
    </filter>
    <clipPath id="tile">
      <rect x="100" y="100" width="824" height="824" rx="186"/>
    </clipPath>
  </defs>

  <!-- tile -->
  <g filter="url(#shadow)">
    <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#sky)"/>
  </g>
  <g clip-path="url(#tile)">
    <rect x="100" y="100" width="824" height="824" fill="url(#glow)"/>
    <!-- glide path: a long, calm arc -->
    <path d="M 60 860 C 300 830, 520 700, 690 420"
          fill="none" stroke="url(#trail)" stroke-width="34" stroke-linecap="round"/>
    <path d="M 120 930 C 360 900, 560 790, 700 560"
          fill="none" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="14" stroke-linecap="round"/>
  </g>

  <!-- swept delta-wing glider, nose up-right -->
  <g filter="url(#planeShadow)" transform="translate(700 395) rotate(-38)">
    <!-- far wing (underside, darker) -->
    <path d="M 170 0 L -150 -40 L -95 0 Z" fill="url(#wingUnder)"/>
    <!-- near wing -->
    <path d="M 170 0 L -150 150 L -95 0 Z" fill="url(#wingTop)"/>
    <!-- body ridge -->
    <path d="M 170 0 L -95 0 L -60 18 Z" fill="#D3E0FA"/>
  </g>
</svg>
