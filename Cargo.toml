[package]
name = "glide"
version = "0.1.0"
edition = "2024"
default-run = "glide"
license = "Apache-2.0"
description = "A small desktop web browser"
readme = "README.md"
rust-version = "1.91"
publish = false

[[bin]]
name = "glide"
path = "src/main.rs"

[[bin]]
name = "compat"
path = "src/bin/compat.rs"

[dependencies]
anyrender = "0.14"
anyrender_vello_cpu = { version = "0.18", features = ["softbuffer_window_renderer"] }
blitz-dom = { version = "=0.3.0-beta.4", default-features = false, features = [
    "svg",
    "woff",
    "system-fonts",
    "floats",
    "scrollbars",
] }
blitz-html = "=0.3.0-beta.4"
blitz-net = { version = "=0.3.0-beta.4", features = ["cookies"] }
blitz-paint = { version = "=0.3.0-beta.4", features = ["svg", "scrollbars"] }
blitz-shell = { version = "=0.3.0-beta.4", default-features = false, features = [
    "clipboard",
] }
blitz-traits = "=0.3.0-beta.4"
peniko = "0.6"
png = "0.18"
reqwest = { version = "0.13.5", default-features = false, features = [
    "charset",
    "cookies",
    "http2",
    "native-tls",
    "system-proxy",
] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
url = "2"
winit = "=0.31.0-beta.3"
keyboard-types = "0.8"
v8 = "152.2.0"
crossbeam-channel = "0.5"
once_cell = "1"
html5ever = "0.40"
directories = "6.0.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[profile.release]
lto = false
codegen-units = 8
