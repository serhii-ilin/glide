<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Timing history crypto</title>
</head>
<body>
  <p id="out">pending</p>
  <script>
    (function () {
      var failures = [];
      function check(name, fn) {
        try {
          if (!fn()) failures.push(name);
        } catch (err) {
          failures.push(name + ': ' + err);
        }
      }

      check('timeOrigin', function () {
        return performance.timeOrigin > 1e11
          && performance.timing.navigationStart
          && performance.timing.navigationStart <= performance.timeOrigin;
      });
      check('navigation', function () {
        return performance.navigation.type === 0
          && performance.navigation.redirectCount === 0;
      });
      check('nav-entry', function () {
        var list = performance.getEntriesByType('navigation');
        return list.length === 1 && list[0].entryType === 'navigation';
      });
      check('mark-measure', function () {
        performance.mark('m1');
        performance.mark('m2');
        performance.measure('gap', 'm1', 'm2');
        return performance.getEntriesByName('gap', 'measure').length === 1;
      });
      check('history-push', function () {
        history.pushState({ n: 1 }, '', '/a');
        history.pushState({ n: 2 }, '', '/b');
        return location.pathname === '/b' && history.state.n === 2 && history.length >= 2;
      });
      check('history-replace', function () {
        var len = history.length;
        history.replaceState({ n: 3 }, '', '/c');
        return location.pathname === '/c' && history.state.n === 3 && history.length === len;
      });
      check('crypto-bytes', function () {
        var a = new Uint8Array(8);
        crypto.getRandomValues(a);
        return a.some(function (b) { return b !== 0; });
      });
      check('crypto-uuid', function () {
        var u = crypto.randomUUID();
        return /^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/.test(u);
      });
      check('navigator-lang', function () {
        return navigator.language === 'en-US'
          && navigator.languages[0] === 'en-US'
          && navigator.languages[1] === 'en';
      });

      var crossOk = false;
      try {
        history.pushState({}, '', 'https://evil.example/other');
        crossOk = false;
      } catch (e) {
        crossOk = e.name === 'SecurityError' && location.pathname === '/c';
      }
      check('history-security', function () { return crossOk; });

      document.getElementById('out').textContent = failures.length
        ? 'TIMING-FAIL:' + failures.join(',')
        : 'TIMING-OK';
    })();
  </script>
</body>
</html>
