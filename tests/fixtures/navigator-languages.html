<!DOCTYPE html>
<html>
<body>
  <p id="out">pending</p>
  <script>
    var langsOk = navigator.language === 'en-US' && Object.isFrozen(navigator.languages);
    var platOk = navigator.platform.length > 0;
    var coresOk = navigator.hardwareConcurrency >= 1;
    document.getElementById('out').textContent = langsOk && platOk && coresOk
      ? 'NAV-OK:' + navigator.language + '|' + navigator.languages.join(',')
      : 'NAV-FAIL';
  </script>
</body>
</html>
