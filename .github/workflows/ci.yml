name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  gates:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev libxkbcommon-dev libxkbcommon-x11-0 \
            libxcb1-dev libx11-dev libfontconfig1-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Registry check
        run: |
          node scripts/registry.mjs --check
          node scripts/registry-test.mjs

      - uses: Swatinem/rust-cache@v2
        with:
          # v0 caches predating v8 152.x could restore target/ without
          # target/*/build/gn_out/obj/librusty_v8.a while v8 fingerprints look
          # fresh, so clippy passes and nextest fails to link rusty_v8.
          prefix-key: v1-rust-v8-152
          cache-directories: |
            ${{ env.CARGO_HOME }}/.rusty_v8

      - name: Ensure V8 static library after cache restore
        run: |
          lib=target/debug/build/gn_out/obj/librusty_v8.a
          if [ ! -f "$lib" ] && compgen -G 'target/debug/.fingerprint/v8-*' >/dev/null; then
            cargo clean -p v8
          fi

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.152

      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo nextest run --profile ci
      - run: cargo test --doc
