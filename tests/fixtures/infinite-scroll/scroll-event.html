<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Infinite scroll (scroll event)</title>
<style>
  body { margin: 0; font: 16px sans-serif; }
  .item { height: 200px; border-bottom: 1px solid #ccc; }
</style>
</head>
<body>
<div id="feed"></div>
<p id="status">page 0</p>
<p id="pos">scrollY=0</p>
<script>
  // Loads the next page when the viewport bottom is within 100px of the document
  // bottom, checked from a window scroll listener. The test serves /items?page=N.
  var page = 0;
  var loading = false;
  var MAX_PAGES = 3;
  function loadNext() {
    if (loading || page >= MAX_PAGES) return;
    loading = true;
    fetch('/items?page=' + (page + 1))
      .then(function (r) { return r.json(); })
      .then(function (items) {
        page += 1;
        var feed = document.getElementById('feed');
        items.forEach(function (text) {
          var div = document.createElement('div');
          div.className = 'item';
          div.textContent = text;
          feed.appendChild(div);
        });
        document.getElementById('status').textContent = 'page ' + page;
        loading = false;
      });
  }
  window.addEventListener('scroll', function () {
    document.getElementById('pos').textContent = 'scrollY=' + Math.round(window.scrollY);
    var bottom = window.scrollY + window.innerHeight;
    if (bottom >= document.documentElement.scrollHeight - 100) loadNext();
  });
  loadNext();
</script>
</body>
</html>
